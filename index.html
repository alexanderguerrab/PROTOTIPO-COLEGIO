dcs(){const g=S[si].g,ds=DOC.map((d,i)=>[d,i]).filter(x=>x[0].sec.includes(g));return sel()+`<h2>Docentes de ${g}</h2><div class="g">${ds.map(([d,i])=>`<div class="c" style="text-align:center">${avt(d)}<h3>${d.n}</h3><div class="mu">${mts(d,g).join(', ')}</div>${TUT[g]==i?'<span class="t" style="color:var(--p)">Docente guía</span>':''}<div class="row" style="margin-top:10px"><button onclick="prof(${i})">Ver perfil</button><button class="pr" onclick="openChat('Docentes')">Escribir</button></div></div>`).join('')||'<div class="c"><p class="mu" style="text-align:center">Esta sección aún no tiene docentes asignados.</p></div>'}</div><p class="mu" style="text-align:center">Solo se muestran los docentes de la sección donde ${S[si].n} está inscrito.</p>`},
asi(){if(!sc)return noSec();const g=S.filter(s=>act(s)&&s.g==sc);return scs()+`<div class="c"><h3>Asistencia de hoy · ${sc}</h3>${g.map(s=>`<label class="row" style="padding:6px 0"><span>${s.n}</span><input type="checkbox" style="flex:0" ${s.as?'checked':''} onchange="S.find(x=>x.n=='${s.n}').as=this.checked"></label>`).join('')||'<p class="mu" style="text-align:center">Sin estudiantes en esta sección.</p>'}<button class="pr" onclick="toast('Asistencia guardada. Representantes notificados')">Guardar asistencia</button></div>`},
mp(){const d=DOC[dc],gr='display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))',f=(id,l,v,ty)=>`<div><label class="mu">${l}</label><input id="${id}" ${ty||''} value="${ea(v)}"></div>`;return `<h2>Mi perfil</h2><div class="c">${avt(d,1)}<p class="mu" style="text-align:center">Así te ven los representantes de tus secciones. La materia y las secciones las asigna el administrador.</p><div style="${gr}">${f('m_n','Nombre',d.n)}${f('m_ti','Formación académica',d.ti)}${f('m_ex','Años de experiencia',d.ex,'type="number" min="0"')}${f('m_foto','URL de tu foto (opcional)',d.foto)}${f('m_at','Horario de atención a representantes',d.at)}<div><label class="mu">Materias que dicta (asignadas)</label><input value="${tm(d)}" disabled></div></div><label class="mu" style="display:block;margin-top:10px">Presentación personal</label><textarea id="m_bio" rows="4">${d.bio}</textarea><h3 style="margin-top:14px">Mis materias por sección</h3><table><tr><th>Sección</th><th>Materia(s)</th></tr>${d.sec.map(x=>`<tr><td>${x}</td><td>${mts(d,x).join(', ')}</td></tr>`).join('')||'<tr><td colspan="2" class="mu">Aún no tienes secciones asignadas</td></tr>'}</table><div class="row"><button class="pr" onclick="saveP()">Guardar mi perfil</button></div></div>`},
bd(){const l=bdList(),pm=av(S.map(prom)),mo=S.filter(s=>fam(s.f)[0]=='er').length;return `<h2>Base de datos de estudiantes</h2><div class="g" style="margin-bottom:12px"><div class="c"><div class="mu">Total registrados</div><div class="k">${S.length}</div></div><div class="c"><div class="mu">Activos</div><div class="k ok">${S.filter(act).length}</div></div><div class="c"><div class="mu">Con familia en mora</div><div class="k er">${mo}</div></div><div class="c"><div class="mu">Promedio general</div><div class="k">${pm==null?'—':pm.toFixed(1)}</div></div></div>
<div class="c"><div class="row"><input id="bdq" placeholder="Buscar por nombre, cédula o representante" value="${ea(bq)}" oninput="setF('bq',this.value)"><select onchange="setF('bs',this.value)"><option value="">Todas las secciones</option>${SEC.map(x=>`<option ${x==bs?'selected':''}>${x}</option>`).join('')}</select><select onchange="setF('bp',this.value)"><option value="">Todos los estados de pago</option><option value="ok" ${bp=='ok'?'selected':''}>Al día</option><option value="wn" ${bp=='wn'?'selected':''}>Por vencer / en revisión</option><option value="er" ${bp=='er'?'selected':''}>En mora</option></select></div><div class="row" style="margin-top:8px"><button class="pr" onclick="ficha(-1)">+ Nuevo estudiante</button><button onclick="expCsv()">Exportar a CSV (Excel)</button></div><div class="mu" id="bdn" style="text-align:center;margin:10px 0">${l.length} de ${S.length} estudiantes</div><div style="overflow-x:auto"><table><tr><th>N.º</th><th>Estudiante</th><th>Cédula escolar</th><th>Sección</th><th>Representante</th><th>Promedio</th><th>Estado de pago</th><th>Ficha</th></tr><tbody id="bdt">${bdTr(l)}</tbody></table></div></div>`},
sec(){return `<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${SEC.map(x=>{const l=S.filter(s=>act(s)&&s.g==x),dd=DOC.filter(d=>d.sec.includes(x));return `<div class="c"><h3>${x}</h3><div class="k" style="text-align:center">${l.length}<span class="mu"> / ${CUPO}</span></div><div class="bar"><i style="width:${l.length/CUPO*100}%;background:var(--p)"></i></div><div class="row" style="margin-top:12px"><button onclick="secModal('${x}')">Ver estudiantes (${l.length})</button><button onclick="docModal('${x}')">Ver docentes (${dd.length})</button></div></div>`}).join('')}</div>
<div class="c" style="margin-top:12px"><h3>Asignar secciones a docentes</h3><div style="overflow-x:auto"><table><tr><th>Docente</th>${SEC.map(x=>`<th style="text-align:center">${x}</th>`).join('')}</tr>${DOC.map((d,i)=>`<tr><td>${d.n}<div class="mu">${tm(d)}</div></td>${SEC.map(x=>`<td style="text-align:center"><input type="checkbox" style="width:auto" ${d.sec.includes(x)?'checked':''} onchange="tg(${i},'${x}')">${d.sec.includes(x)?`<div class="mu">${mts(d,x).join(', ')}</div>`:''}</td>`).join('')}</tr>`).join('')}</table></div></div>
<div class="c"><h3>Asignar estudiantes a una sección</h3><table><tr><th>Estudiante</th><th>Sección</th></tr>${S.map((s,i)=>`<tr><td>${s.n}</td><td><select onchange="mv(${i},this.value)">${SEC.map(x=>`<option ${x==s.g?'selected':''}>${x}</option>`).join('')}</select></td></tr>`).join('')}</table></div>
<div class="c"><h3>Inscribir nuevo estudiante</h3><div class="row"><input id="en" placeholder="Nombre completo"><input id="ef" placeholder="Apellido de la familia"><select id="es">${SEC.map(x=>`<option>${x}</option>`).join('')}</select><button class="pr" onclick="enr()">Inscribir</button></div><p class="mu" style="text-align:center">Cada sección admite hasta ${CUPO} estudiantes. Docentes y representantes ven el cambio de inmediato.</p></div>`},
dp(){const t=F.reduce((a,x)=>a+x.m,0),by=s=>F.filter(x=>x.st==s).reduce((a,x)=>a+x.m,0),fs=[...new Set(S.map(s=>s.f))],pc=s=>by(s)/t*100;
return `<div class="g"><div class="c"><div class="mu">Facturado</div><div class="k">${mon(t)}</div></div><div class="c"><div class="mu">Cobrado</div><div class="k ok">${mon(by('pagado'))}</div></div><div class="c"><div class="mu">Deuda en mora</div><div class="k er">${mon(by('mora'))}</div></div><div class="c"><div class="mu">Por verificar</div><div class="k wn">${mon(by('revision'))}</div></div></div>
<div class="c" style="margin-top:12px"><div class="bar"><i style="width:${pc('pagado')}%;background:var(--ok)"></i><i style="width:${pc('revision')}%;background:var(--wn)"></i><i style="width:${pc('mora')}%;background:var(--er)"></i></div></div>
<div class="c"><h3>Estado por familia</h3><table><tr><th>Familia</th><th>Deuda en mora</th><th>Estado</th><th>Acción</th></tr>${fs.map(f=>`<tr><td>${f}</td><td>${mon(F.filter(x=>S[x.s].f==f&&x.st=='mora').reduce((a,x)=>a+x.m,0))}</td><td><span class="t ${fam(f)[0]}">${fam(f)[1]}</span></td><td><button onclick="toast('Recordatorio enviado a familia ${f}')">Recordar</button></td></tr>`).join('')}</table></div>`},
ver(){const p=F.map((f,i)=>[f,i]).filter(x=>x[0].st=='revision');return `<div class="c"><h3>Pagos reportados</h3>${p.map(([x,i])=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><span>${S[x.s].n} · ${x.c}<br><span class="mu">${x.mt} · ref. ${x.ref} · ${mon(x.m)}</span></span><button class="pr" style="flex:0" onclick="vf(${i},this)">Verificar con banco</button></div>`).join('')||'<p class="mu">No hay pagos pendientes de verificación.</p>'}<p class="mu">Demo: la verificación simula la consulta a la API del banco por número de referencia.</p></div>`},
cfg(){return `<div class="c"><h2>Configuración de la institución</h2><div class="row"><div><label class="mu">Nombre</label><input id="cn" value="${inst.n}"></div><div><label class="mu">Color principal</label><input id="cc" type="color" value="${inst.c}"></div></div>
<label class="mu">URL del video de fondo (login)</label><input id="cv" value="${inst.v}" placeholder="https://.../video.mp4" style="margin-bottom:8px">
<div class="row"><div><label class="mu">Capacidad de usuarios</label><input id="ck" type="number" value="${inst.cap}"></div><label><input type="checkbox" id="cr" style="width:auto" ${inst.rc?'checked':''}> Emitir recibos tras verificar</label></div>
<div class="row"><div><label class="mu">Año de fundación</label><input id="cf" type="number" value="${inst.fund}"></div></div><label class="mu">Reseña histórica</label><textarea id="ch" rows="4" style="margin-bottom:8px">${inst.hist}</textarea><div class="row"><div><label class="mu">Misión</label><textarea id="cmi" rows="3">${inst.mis}</textarea></div><div><label class="mu">Visión</label><textarea id="cvi" rows="3">${inst.vis}</textarea></div></div><h3 style="margin-top:14px">Perfil del director</h3><div class="row"><div><label class="mu">Nombre</label><input id="dn" value="${ea(inst.dir.n)}"></div><div><label class="mu">Cargo</label><input id="dt" value="${ea(inst.dir.t)}"></div></div><div class="row" style="margin:8px 0"><div><label class="mu">Formación y trayectoria</label><input id="dti" value="${ea(inst.dir.ti)}"></div><div><label class="mu">URL de foto (opcional)</label><input id="df" value="${ea(inst.dir.foto)}"></div></div><label class="mu">Mensaje a la comunidad</label><textarea id="dm" rows="3">${inst.dir.msg}</textarea><p class="mu">Uso: ${S.length} estudiantes registrados · capacidad de ${inst.cap} usuarios · Escala 1–20 · mínimo aprobatorio 10 · 3 lapsos</p><button class="pr" onclick="sv()">Guardar cambios</button></div>`}};
const y0=n=>new Date(cm.getFullYear(),cm.getMonth()+n,1);
function send(){const t=$('#tx').value.trim();if(!t)return;AR[ca].push(['me',t]);shell();const k=ca;setTimeout(()=>{AR[k].push(['o','Recibido, le responderemos a la brevedad.']);if(view=='cha'&&ca==k)shell()},1200)}
function gn(n,v){const s=S.find(x=>x.n==n);v=+v;if(v<1||v>20){toast('La nota debe estar entre 1 y 20');return shell()}NN(s,mat())[lap-1]=v}
function addM(){const d=$('#md').value.trim();if(!d)return toast('Escribe el detalle del método');inst.im.push({t:$('#mt').value,d});shell();toast('Método publicado')}
function delM(i){inst.im.splice(i,1);shell();toast('Método eliminado')}
function pub(){const t=$('#pt').value.trim();if(!t)return toast('Escribe un título');P.unshift({t,x:$('#px').value,g:$('#pg').value,d:'hoy'});shell();toast('Publicado')}
function rep(i){if(!inst.im.length)return toast('La institución aún no tiene métodos de pago configurados');modal(`<h3>Reportar pago · ${F[i].c}</h3><label class="mu">Método usado</label><select id="rm">${inst.im.map(m=>`<option>${m.t} — ${m.d}</option>`).join('')}</select><label class="mu">Número de referencia</label><input id="rr" placeholder="Ej. 48210377"><div class="row" style="margin-top:12px"><button onclick="cl()">Cancelar</button><button class="pr" onclick="rp(${i})">Enviar para verificación</button></div>`)}
function rp(i){const r=$('#rr').value.trim();if(!r)return toast('Falta la referencia');Object.assign(F[i],{st:'revision',ref:r,mt:$('#rm').value.split(' — ')[0]});cl();shell();toast('Pago enviado a verificación')}
function vf(i,b){b.textContent='Consultando banco…';setTimeout(()=>{F[i].st='pagado';if(inst.rc)F[i].rcp='REC-'+(1100+i);shell();toast('Pago verificado'+(inst.rc?' · recibo emitido':''))},900)}
function rec(i){const x=F[i];modal(`<h3>Recibo ${x.rcp}</h3><p>${inst.n}<br>Estudiante: ${S[x.s].n}<br>Concepto: ${x.c}<br>Monto: <b>${mon(x.m)}</b><br>Estado: Pago verificado</p><div class="row"><button onclick="window.print()">Imprimir</button><button class="pr" onclick="cl()">Cerrar</button></div>`)}
function sv(){inst.n=$('#cn').value;inst.c=$('#cc').value;inst.v=$('#cv').value;inst.cap=+$('#ck').value;inst.rc=$('#cr').checked;inst.fund=$('#cf').value;inst.hist=$('#ch').value;inst.mis=$('#cmi').value;inst.vis=$('#cvi').value;inst.dir={n:$('#dn').value,t:$('#dt').value,ti:$('#dti').value,foto:$('#df').value,msg:$('#dm').value};document.documentElement.style.setProperty('--p',inst.c);shell();toast('Cambios guardados')}
login();
</script></body></html>
